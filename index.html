<title>Study Harness · Review</title>

<style>
/* One page, two homes: served by `study review` on the laptop, or published by `study phone publish`,
   where it reads cards from the private vault repo with a token that stays on the phone. */
:root{color-scheme:dark;--bg:#0b0d10;--panel:#101317;--panel2:#151a20;--line:#1f262e;--line2:#2a333d;
--ink:#e8e6e1;--ink2:#b9bdc2;--muted:#7f8994;--amber:#ffb000;--amber-dim:#a87400;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--ok:#0ca30c;--warn:#fab219;--crit:#e05252;
--font:"JetBrains Mono","IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{background:var(--bg)}body{margin:0;color:var(--ink);font:13px/1.55 var(--font);-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}button{font:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line2)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 24px}
.brand{font-weight:700;letter-spacing:.12em;color:var(--amber);padding-bottom:9px}.brand span{color:var(--muted);font-weight:400;letter-spacing:.04em;margin-left:10px}
.nav{display:flex;gap:2px}.nav a{padding:6px 12px 8px;color:var(--muted);text-decoration:none;letter-spacing:.08em;text-transform:uppercase;font-size:12px;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}.nav a[aria-current=page]{color:var(--amber);border-bottom-color:var(--amber)}
.sync{margin-left:auto;padding-bottom:9px;font-size:11.5px;color:var(--muted)}.sync.bad{color:var(--warn)}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 48px}
.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}aside{order:2}.wrap{padding:10px 10px 32px}}
.panel{background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ph h2{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:600}
.pb{padding:12px 14px}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);padding:3px 10px;font-size:11.5px;letter-spacing:.04em;cursor:pointer}
.chip[aria-pressed=true]{color:var(--amber);border-color:var(--amber)}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}
.progress{height:3px;background:var(--line);margin-bottom:10px}.progress i{display:block;height:100%;background:var(--amber);transition:width .2s}
/* the card */
.stage{position:relative;touch-action:pan-y}
.card{background:var(--panel);border:1px solid var(--line2);padding:14px;position:relative;transition:transform .25s ease,opacity .25s ease;will-change:transform}
.card.dragging{transition:none}
.card .hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:3px 12px;font-weight:700;letter-spacing:.12em;border:2px solid;background:var(--bg);opacity:0;pointer-events:none;z-index:2}
.card .hint.left{color:var(--warn);border-color:var(--warn)}.card .hint.right{color:var(--ok);border-color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.tag{border:1px solid var(--line2);padding:0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.reason{color:var(--muted);font-size:11.5px;margin:-4px 0 10px}.reason b{color:var(--ink2);font-weight:500}
.term{background:#000;border:1px solid var(--line);color:var(--ink);padding:14px 16px;white-space:pre-wrap;word-break:break-word;margin:0 0 12px;font:14px/1.6 var(--font)}
.term.back{color:var(--ink2);border-color:var(--line2)}.term.mine{color:var(--ink2);border-left:3px solid var(--amber-dim)}
.tap{cursor:pointer}.tapnote{color:var(--muted);font-size:11.5px;text-align:center;margin:-4px 0 12px}
.label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.ans{display:flex;gap:8px;margin-bottom:12px}
.ans input,textarea,.setup input{flex:1;min-width:0;background:#000;color:var(--ink);border:1px solid var(--line2);padding:10px;font:14px var(--font);color-scheme:dark}
textarea{width:100%;min-height:110px;resize:vertical;margin-bottom:10px;display:block}
.ans input:focus,textarea:focus,.setup input:focus{border-color:var(--amber);outline:none}
.btn{background:var(--amber);color:#111;border:0;padding:9px 16px;font-weight:700;cursor:pointer;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2);font-weight:400}.btn.ghost:hover{color:var(--amber);border-color:var(--amber)}
.btn.wide{width:100%}.btn:disabled{opacity:.4;cursor:default}
.verdict{margin-bottom:12px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--crit)}.verdict code{color:var(--ink)}
.marks{border:1px solid var(--line2);padding:8px 10px;margin-bottom:12px;font-size:12.5px}.marks .h{color:var(--muted);margin-bottom:4px}
.marks ul{list-style:none;margin:0;padding:0}.marks li{padding:2px 0}.marks .y{color:var(--ok)}.marks .n{color:var(--crit)}.marks q{color:var(--ink2)}
.moved{border:1px solid var(--line2);border-left:3px solid var(--ok);padding:6px 10px;margin-bottom:12px;color:var(--ink2)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grades button{display:flex;flex-direction:column;align-items:center;padding:8px 4px;line-height:1.3;background:#000;color:var(--ink);border:1px solid var(--line2);cursor:pointer}
.grades button:hover{border-color:var(--amber)}.grades button small{font-size:10.5px;color:var(--muted)}
.grades button.suggest{border-color:var(--amber);color:var(--amber)}
.swipehelp{color:var(--muted);font-size:11px;text-align:center;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000;border:1px solid var(--amber-dim);padding:8px 14px;display:flex;gap:14px;align-items:center;z-index:20;max-width:92vw}
.toast button{background:none;border:0;color:var(--amber);font-weight:700;cursor:pointer;padding:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:22px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat.hot b{color:var(--amber)}
.mod{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}.mod:first-child{border-top:0}.mod .r{color:var(--muted);text-align:right;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:2px;height:64px;border-bottom:1px solid var(--line2)}.bars div{flex:1;background:var(--s1);border-radius:3px 3px 0 0;min-height:0}
.done{text-align:center;padding:28px 10px}.done h3{margin:0 0 6px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.muted{color:var(--muted)}.err{color:var(--crit)}kbd{font:11px var(--font);border:1px solid var(--line2);padding:0 4px;color:var(--ink2)}
.keys{font-size:11.5px;color:var(--muted);line-height:2}
.setup{max-width:520px;margin:24px auto}.setup label{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.setup p{color:var(--ink2)}.setup code{color:var(--amber)}
.tabs{display:flex;gap:2px;margin-bottom:10px;border-bottom:1px solid var(--line2);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:6px 12px 7px;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--amber);border-bottom-color:var(--amber)}.tabs .n{color:var(--ink2);margin-left:4px}
.list{list-style:none;margin:0;padding:0}.list li{background:var(--panel);border:1px solid var(--line);padding:10px 12px;margin-bottom:8px}
.list .meta{margin-bottom:6px}.list .you{color:var(--crit);white-space:pre-wrap;overflow-wrap:anywhere}.list .right{color:var(--ok);white-space:pre-wrap;overflow-wrap:anywhere}
.list .term{margin-bottom:8px;font-size:13px;padding:10px 12px}.fb{color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.sumtext{background:#000;border:1px solid var(--line);padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 var(--font);margin:0}
.photo-form label{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.photo-form select,.photo-form input[type=text]{background:#000;color:var(--ink);border:1px solid var(--line2);padding:10px;font:14px var(--font);color-scheme:dark}
.photo-form img{max-width:100%;max-height:50vh;display:block;margin:0 0 12px;border:1px solid var(--line2)}
.cardtools{display:flex;justify-content:flex-end;margin-top:8px}
@media(max-width:820px){.keys-panel{display:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<body>
<header class="top"><div class="bar">
  <div class="brand">STUDY<span id="today"></span></div>
  <nav class="nav" aria-label="Pages" id="nav"><a href="/">Today</a><a href="/deadlines">Deadlines</a><a href="/review" aria-current="page">Review</a></nav>
  <div class="sync" id="sync" aria-live="polite"></div>
</div></header>
<div class="wrap" id="main">
  <div class="layout">
    <main>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="v-review">
        <div class="filters" id="filters" role="group" aria-label="Module filter"></div>
        <div class="progress"><i id="bar" style="width:0"></i></div>
        <div class="stage" id="stage"></div>
      </div>
      <div id="v-other" hidden></div>
    </main>
    <aside>
      <section class="panel"><div class="ph"><h2>Today</h2><span class="muted" id="count"></span></div><div class="pb"><div class="stats">
        <div class="stat hot"><b id="sLeft">0</b><span>LEFT IN QUEUE</span></div>
        <div class="stat"><b id="sDone">0</b><span>REVIEWED TODAY</span></div>
        <div class="stat"><b id="sGood">–</b><span>GOOD OR EASY</span></div>
        <div class="stat"><b id="sTok">0</b><span id="sTokLabel">SUBSCRIPTION TOKENS</span></div></div></div></section>
      <section class="panel"><div class="ph"><h2>Modules</h2></div><div class="pb" id="mods"></div></section>
      <section class="panel"><div class="ph"><h2>Due · 14 days</h2></div><div class="pb"><div class="bars" id="forecast"></div></div></section>
      <section class="panel keys-panel"><div class="pb keys"><kbd>space</kbd> reveal · <kbd>enter</kbd> check · <kbd>ctrl</kbd>+<kbd>enter</kbd> submit an explanation · <kbd>ctrl</kbd>+<kbd>z</kbd> undo the last grade<br><kbd>1</kbd> again <kbd>2</kbd> hard <kbd>3</kbd> good <kbd>4</kbd> easy · swipe a revealed card: left hard, right easy</div></section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAMES = ['again', 'hard', 'good', 'easy'];
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const pad = n => String(n).padStart(2, '0');
const localIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const todayIso = () => localIso(new Date()).slice(0, 10);
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

// ---- answer matching, the same rules as matching.py (values, separators, correct rounding) ----
const NUM = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?%?$/;
function parseNum(t) {
  t = t.replace('−', '-');
  if (/^[+-]?\d+\/\d+$/.test(t)) { const [a, b] = t.split('/').map(Number); return b ? {v: a / b, places: null, sig: 3} : null; }
  if (!NUM.test(t)) return null;
  const pct = t.endsWith('%'), s = t.replace('%', ''), [mant, ex] = s.split(/[eE]/);
  const frac = (mant.split('.')[1] || '').length, exp = ex ? Number(ex) : 0;
  return {v: Number(s) / (pct ? 100 : 1), places: Math.max(0, frac - exp) + (pct ? 2 : 0), sig: mant.replace(/[-+.]/g, '').replace(/^0+/, '').length || 1};
}
const close = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b));
const rounded = (x, p) => { const f = 10 ** p; return [Math.round(x * f) / f, Math.sign(x) * Math.floor(Math.abs(x) * f + 0.5) / f, Number(x.toFixed(p))]; };
function numbersMatch(g, e) {
  if (close(g.v, e.v)) return true;
  if (e.places === 0) return false;
  if (g.places !== null && (e.places === null || g.places < e.places))
    return (g.sig >= 3 || g.places >= 3) && rounded(e.v, g.places).some(r => close(r, g.v));
  if (e.places !== null && (g.places === null || g.places > e.places)) return rounded(g.v, e.places).some(r => close(r, e.v));
  return false;
}
const PAIRS = {'[': ']', '(': ')', '{': '}'}, CLOSERS = new Set(Object.values(PAIRS)), BRACKETS = '[](){}';
function tokens(text, r) {
  if (r) text = text.replace(/^\s*\[\d+\][ \t]+(?=\S)/gm, '');
  text = text.replace(/\bmatrix\s*\(/gi, '(');
  for (const b of BRACKETS) text = text.split(b).join(` ${b} `);
  return text.trim().split(/[\s,;=:​]+/).filter(t => t.replace(/\./g, '')).map(t => parseNum(t) ? t : t.replace(/\.$/, ''));
}
function unwrap(items) {
  while (items.length >= 2 && PAIRS[items[0]] === items[items.length - 1]) {
    let depth = 0, end = -1;
    for (let i = 0; i < items.length; i++) { depth += (items[i] in PAIRS) - CLOSERS.has(items[i]); if (depth === 0) { end = i; break; } }
    if (end !== items.length - 1) break;
    items = items.slice(1, -1);
  }
  return items;
}
function sameToken(g, e) {
  if (BRACKETS.includes(g) || BRACKETS.includes(e)) return g === e || ('[('.includes(g) && '[('.includes(e)) || ('])'.includes(g) && '])'.includes(e));
  const a = parseNum(g), b = parseNum(e);
  if (a && b) return numbersMatch(a, b);
  return !a && !b && g.toLowerCase() === e.toLowerCase();
}
const sameSeq = (g, e) => g.length === e.length && g.every((t, i) => sameToken(t, e[i]));
function answersMatch(given, expected, lang) {
  if (!given.trim() || !expected.trim()) return false;
  const norm = s => s.replace(/[\s​]+/g, '').toLowerCase().replace(/\.$/, ''), digits = s => (s.match(/\d+/g) || []).join(',');
  if (norm(given) === norm(expected) && digits(given) === digits(expected)) return true;
  const want = unwrap(tokens(expected, lang === 'r')), got = unwrap(tokens(given, lang === 'r'));
  if (!want.length || !got.length) return false;
  if (sameSeq(got, want)) return true;
  if (want.every(t => parseNum(t))) {
    const labels = got.filter(t => !parseNum(t));
    return labels.every(t => !BRACKETS.includes(t)) && sameSeq(got.filter(t => parseNum(t)), want);
  }
  return false;
}

// ---- where the cards come from ----
async function json(r) { const d = await r.json(); if (!r.ok) throw new Error(d.error || r.statusText); return d; }
const serverBackend = {
  async state() { return json(await fetch('/api/state')); },
  async queue(filter) { return (await json(await fetch('/api/queue?module=' + filter))).cards; },
  post: async (path, body) => json(await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})),
  check(c, answer) { return this.post('/api/check', {module: c.module, id: c.id, answer, day: c.day}); },
  async undo(c) { return (await this.post('/api/undo', {module: c.module, id: c.id})).message; },
  mark(c, attempt) { return this.post('/api/mark', {module: c.module, id: c.id, attempt}); },
  grade(c, grade, checked, seconds, extra) { return this.post('/api/grade', {module: c.module, id: c.id, grade, checked, seconds, ...extra}); },
  async mistakes() { return (await json(await fetch('/api/mistakes'))).mistakes.filter(m => !m.fixed); },
  async summary(slug) { return (await json(await fetch('/api/summary?module=' + encodeURIComponent(slug)))).text; },
  photos: null,  // photos go from the phone; on the laptop, put the image in the vault and tell the tutor
  status() { return ''; },
};

// On the phone: phone/cards.json in the private vault repo, written by the laptop at each sync, and grades
// appended to phone/grades.jsonl, which the laptop imports. The token never leaves this browser.
const CFG_KEY = 'study.github', PENDING_KEY = 'study.pending';
const store = {get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};
const b64 = {
  decode: s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0))),
  encode: s => { const bytes = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); },
};
const githubBackend = {
  data: null, graded: [],
  cfg() { return store.get(CFG_KEY, null); },
  url(path) { const c = this.cfg(); return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`; },
  async api(path, opts = {}) {
    const r = await fetch(this.url(path), {...opts, cache: 'no-store', headers: {Authorization: `Bearer ${this.cfg().token}`, Accept: 'application/vnd.github+json', ...(opts.headers || {})}});
    if (r.status === 401 || r.status === 403) throw new Error('GitHub refused the token. Check it can read and write this repo.');
    return r;
  },
  async load() {
    const r = await this.api('phone/cards.json', {headers: {Accept: 'application/vnd.github.raw+json'}});
    if (r.status === 404) throw new Error('No phone/cards.json in the vault yet. On the laptop run: study phone export, then study save.');
    if (!r.ok) throw new Error(`GitHub answered ${r.status}.`);
    this.data = JSON.parse(await r.text());
    const g = await this.api('phone/grades.jsonl');
    const rows = g.ok ? b64.decode((await g.json()).content).split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean) : [];
    const ids = new Set(rows.map(r => r.id));
    this.graded = [...rows, ...store.get(PENDING_KEY, []).filter(p => !ids.has(p.id))];
  },
  // grades the laptop hasn't counted yet (not in its last export), minus undone ones
  since() {
    const out = [], counted = new Set(this.data.imported || []);
    for (const r of this.graded) {
      if (counted.has(r.id)) continue;
      if (r.undo) { const i = out.map(x => x.card).lastIndexOf(r.card); if (i >= 0) out.splice(i, 1); } else out.push(r);
    }
    return out;
  },
  instance(c) { const day = todayIso(); return {...c, ...(c.instances?.[day] || {}), day}; },
  async state() {
    if (!this.data) await this.load();
    const done = this.since(), q = await this.queue('all');
    const today = done.filter(r => r.at.slice(0, 10) === todayIso());
    const forecast = Array(14).fill(0), base = new Date(todayIso() + 'T12:00');
    for (const c of this.data.cards) { const d = Math.round((new Date(c.due.slice(0, 10) + 'T12:00') - base) / 864e5); if (d > 0 && d < 14) forecast[d]++; }
    forecast[0] = q.length;
    return {today: new Date().toLocaleDateString('en-IE', {weekday: 'long', day: 'numeric', month: 'long'}), reviewedToday: today.length, goodToday: today.filter(r => r.grade >= 3).length, forecast,
      modules: this.data.modules.map(m => ({...m, hasSummary: !!(this.data.summaries || {})[m.slug], due: q.filter(c => c.module === m.slug && !c.new).length, new: q.filter(c => c.module === m.slug && c.new).length, total: this.data.cards.filter(c => c.module === m.slug).length}))};
  },
  async queue(filter) {
    if (!this.data) await this.load();
    const now = localIso(new Date()), last = {};
    for (const r of this.since()) last[r.card] = r;
    // A card graded since the export is done for now, unless it was `again`; the laptop reschedules it at its next sync.
    return this.data.cards.filter(c => (filter === 'all' || c.module === filter) && c.due <= now && (!last[c.id] || last[c.id].grade === 1)).map(c => this.instance(c));
  },
  async check(c, answer) {
    if (c.expected == null) throw new Error('This card\'s answer wasn\'t worked out on the laptop.');
    return {correct: answersMatch(answer, c.expected, c.lang), expected: c.expected};
  },
  async grade(c, grade, checked, seconds, extra) {
    const row = {id: newId(), module: c.module, card: c.id, grade, at: localIso(new Date()), seconds, checked};

  $('main').innerHTML = `<div class="setup panel"><div class="ph"><h2>Connect your vault</h2></div><div class="pb">
    <p>This page reads your review cards from your private vault repo on GitHub and saves your grades back there. The token stays in this browser only.</p>
    ${message ? `<p class="err">${esc(message)}</p>` : ''}
    <label>GitHub user<input id="owner" autocapitalize="off" spellcheck="false" value="${esc(c.owner || '')}"></label>
    <label>Vault repo<input id="repo" autocapitalize="off" spellcheck="false" value="${esc(c.repo || 'study-vault')}"></label>
    <label>Token<input id="token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <p class="muted">Make a fine-grained token at github.com → Settings → Developer settings → Personal access tokens, with access to the vault repo only and <code>Contents: Read and write</code>.</p>
    <button class="btn wide" id="save">Connect</button></div></div>`;
  $('save').onclick = () => {
    const v = id => $(id).value.trim();
    if (!v('owner') || !v('repo') || !v('token')) return;
    store.set(CFG_KEY, {owner: v('owner'), repo: v('repo'), token: v('token')});
    location.reload();
  };
}
if (!LOCAL) {
  document.title = 'Study · Review';
  $('nav').innerHTML = '<a href="#" id="disconnect">Disconnect</a>';
  $('disconnect').onclick = e => { e.preventDefault(); if (confirm('Remove the token from this phone?')) { localStorage.removeItem(CFG_KEY); location.reload(); } };
  $('sTokLabel').textContent = 'WAITING TO SAVE';
  addEventListener('online', () => githubBackend.flush());
}
if (!LOCAL && !githubBackend.cfg()) setup();
else load().then(() => { tabs(); if (!LOCAL) githubBackend.flush(); })
  .catch(e => LOCAL ? ($('stage').innerHTML = `<div class="err">${esc(e.message)}</div>`) : setup(e.message));
</script>
</body>
</html>
